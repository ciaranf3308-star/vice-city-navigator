<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vice City Navigator</title>
<meta name="theme-color" content="#140823">
<meta name="description" content="Turn-by-turn navigation with a Vice City neon soul.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>

<!-- vignette / scanline flavor -->
<div id="fx" aria-hidden="true"></div>

<!-- ============ START / SEARCH PANEL ============ -->
<section id="start-panel" class="panel">
  <h1 class="vc-title">Vice City <span>Navigator</span></h1>
  <p class="tagline">your streets, but neon</p>

  <div class="field">
    <label>From</label>
    <button id="origin-btn" class="chip active">My location</button>
  </div>

  <div class="field">
    <label>Where to?</label>
    <input id="search" type="search" placeholder="Search places…" autocomplete="off" enterkeyhint="search">
    <ul id="results" hidden></ul>
  </div>

  <div id="route-card" hidden>
    <div class="route-meta">
      <strong id="route-dist"></strong><span>•</span><span id="route-time"></span>
    </div>
    <button id="start-btn" class="big-btn">Start navigation</button>
  </div>

  <p class="attrib">Map © OpenStreetMap contributors · Tiles OpenFreeMap · Routing OSRM</p>
</section>

<!-- ============ NAV BANNER ============ -->
<section id="nav-banner" hidden>
  <div id="maneuver-arrow" aria-hidden="true"></div>
  <div class="banner-text">
    <div id="next-dist">—</div>
    <div id="next-instr">—</div>
    <div id="trip-meta">—</div>
  </div>
</section>

<!-- ============ NAV CONTROLS ============ -->
<div id="nav-controls" hidden>
  <button id="mute-btn" class="ctl" title="Voice on/off" aria-label="Toggle voice"></button>
  <button id="follow-btn" class="ctl on" title="Follow me" aria-label="Toggle follow"></button>
  <button id="zoom-in" class="ctl" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zoom-out" class="ctl" title="Zoom out" aria-label="Zoom out">−</button>
  <button id="end-btn" class="ctl danger" title="End navigation" aria-label="End navigation">✕</button>
</div>

<!-- ============ AMBIENT POI CARD ============ -->
<section id="poi-card" class="panel" hidden>
  <button id="poi-close" class="ctl" aria-label="Close">✕</button>
  <div class="poi-head">
    <img id="poi-blip" alt="" width="40" height="40">
    <div>
      <strong id="poi-name">—</strong>
      <small><span id="poi-type">—</span> · <span id="poi-dist">—</span></small>
    </div>
  </div>
  <button id="poi-go" class="big-btn">Set destination</button>
</section>

<div id="toast" hidden></div>

<script src="places-config.js"></script>
<script src="places.js"></script>
<script src="app.js"></script>
</body>
</html>
