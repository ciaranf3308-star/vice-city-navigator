# WayStation Android Auto car shell — compile check.
#
# Runs on pushes touching android/ (or manually). Installs JDK 17 + the
# Android SDK, builds the debug APK and uploads it as an artifact for
# sideloading / Desktop Head Unit testing.

name: Android car shell

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: waystation-auto-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
