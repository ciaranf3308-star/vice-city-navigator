name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'icon*.png'
      - '.well-known/assetlinks.json'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm i -g @bubblewrap/cli

      - name: Restore signing key
        run: echo "${{ secrets.VCN_KEYSTORE_B64 }}" | base64 -d > android.keystore

      - name: Write TWA manifest
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "star.ciaranf3308.vicecitynavigator",
            "host": "ciaranf3308-star.github.io",
            "path": "/vice-city-navigator/",
            "name": "Vice City Navigator",
            "launcherName": "VC Nav",
            "display": "standalone",
            "displayOverride": [],
            "orientation": "portrait",
            "themeColor": "#140823",
            "themeColorDark": "#140823",
            "navigationColor": "#140823",
            "navigationColorDark": "#140823",
            "navigationDividerColor": "#140823",
            "navigationDividerColorDark": "#140823",
            "backgroundColor": "#140823",
            "enableNotifications": false,
            "enableSiteSettingsShortcut": true,
            "startUrl": "/vice-city-navigator/",
            "iconUrl": "https://ciaranf3308-star.github.io/vice-city-navigator/icon-512.png",
            "maskableIconUrl": "https://ciaranf3308-star.github.io/vice-city-navigator/icon-maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersionCode": ${{ github.run_number }},
            "appVersion": "${{ github.run_number }}",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://ciaranf3308-star.github.io/vice-city-navigator/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 24,
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VCN_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VCN_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          bubblewrap update --skipVersionUpgrade
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vice-city-navigator-apk
          path: app-release-signed.apk
