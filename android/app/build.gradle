plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.waystation.auto'
    compileSdk 36

    defaultConfig {
        applicationId 'com.waystation.auto'
        minSdk 23
        targetSdk 36
        // Play uploads (incl. Internal App Sharing) need a unique versionCode
        // per upload: CI run number when available, 2 otherwise.
        versionCode (System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 2)
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            // Populated in CI from repo secrets (see android-release.yml).
            // Local release builds: set WAYSTATION_* env vars yourself.
            storeFile file(System.getenv('WAYSTATION_KEYSTORE_PATH') ?: 'waystation-upload.keystore')
            storePassword System.getenv('WAYSTATION_STORE_PASSWORD')
            keyAlias System.getenv('WAYSTATION_KEY_ALIAS') ?: 'waystation'
            keyPassword System.getenv('WAYSTATION_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            // WebView remote debugging (chrome://inspect) for DHU sessions.
            buildConfigField 'boolean', 'WEBVIEW_DEBUG', 'true'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'WEBVIEW_DEBUG', 'false'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Car App Library 1.7.0 (stable) — CarAppService, NavigationTemplate,
    // AppManager.setSurfaceCallback, NavigationManager.
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    // Custom Tabs for the one-time Spotify PKCE login on the phone.
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
